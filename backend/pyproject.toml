[project]
name = "vectra-futurelab"
version = "0.1.0"
description = "Vectra FutureLab — Invent tomorrow while you sleep."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "httpx[http2]>=0.27",
  "openai>=1.40",
  "rapidfuzz>=3.9",
  "tenacity>=8.5",
  "python-multipart>=0.0.9",
]

[project.scripts]
futurelab = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
