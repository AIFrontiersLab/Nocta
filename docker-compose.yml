services:
  api:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/app/../data
      - ./outputs:/app/../outputs
    command: ["python", "-m", "uvicorn", "app.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8787"]

  web:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8787/api
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    depends_on:
      - api
